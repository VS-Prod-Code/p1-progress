<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>P1 CRM — Progress</title>
<style>
  :root{
    --bg:#0a0a0b;
    --surface:#0f0f11;
    --line:rgba(255,255,255,.06);
    --line-strong:rgba(255,255,255,.12);
    --ink:#ededed;
    --ink-dim:#a1a1a3;
    --muted:#6b6b6e;
    --muted-dim:#48484c;
    --track:#1a1a1d;
    --time:#5b5b62;
    --work:#3ecf8e;
    --warn:#f59e0b;
    --danger:#ef4444;
    --radius:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:'cv02','cv03','cv04','cv11';
    -webkit-font-smoothing:antialiased;
    font-size:17px;
    line-height:1.5;
    letter-spacing:-0.005em;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:80px 24px 64px;
  }
  .notice{
    max-width:720px;
    margin:0 auto;
    padding:10px 24px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.01em;
    background:rgba(245,158,11,.04);
  }
  .notice strong{color:var(--ink-dim);font-weight:500}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:64px;
  }
  .logo{
    font-size:18px;
    font-weight:500;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .logo span{color:var(--muted);font-weight:400;margin-left:8px}
  .updated{
    font-size:17px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .hero{
    margin-bottom:72px;
  }
  .hero .label{
    font-size:15px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:14px;
  }
  .hero .countdown{
    display:flex;
    align-items:baseline;
    gap:14px;
  }
  .hero .days{
    font-size:80px;
    font-weight:600;
    letter-spacing:-0.04em;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .hero .days-label{
    font-size:17px;
    color:var(--ink-dim);
  }
  .hero .deadline{
    margin-top:12px;
    font-size:16px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  section{
    margin-bottom:56px;
  }
  .section-title{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-bottom:24px;
    font-weight:500;
  }

  /* Time bar */
  .bar-row{
    margin-bottom:0;
  }
  .bar-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .bar-name{
    font-size:16px;
    color:var(--ink);
    font-weight:500;
  }
  .bar-pct{
    font-size:16px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }
  .bar-track{
    height:6px;
    background:var(--track);
    border-radius:3px;
    overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%;
    border-radius:3px;
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }
  .bar-fill.time{background:var(--time)}
  .bar-foot{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:15px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* Gantt */
  .gantt{
    position:relative;
    margin-bottom:14px;
    padding-top:22px;
  }
  .gantt-track{
    position:relative;
    height:38px;
    display:flex;
    border-radius:4px;
    overflow:hidden;
    background:var(--track);
  }
  .gantt-seg{
    position:relative;
    height:100%;
    border-right:1px solid var(--bg);
    display:flex;
    align-items:center;
    padding:0 10px;
    font-size:14px;
    color:var(--ink-dim);
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    min-width:0;
  }
  .gantt-seg:last-child{border-right:none}
  .gantt-seg.done{
    background:rgba(91,91,98,.4);
    color:var(--ink-dim);
  }
  .gantt-seg.in-progress{
    background:rgba(62,207,142,.18);
    color:var(--work);
    box-shadow:inset 0 0 0 1px rgba(62,207,142,.35);
  }
  .gantt-seg.planned{
    background:transparent;
    color:var(--muted);
    box-shadow:inset 0 0 0 1px var(--line-strong);
  }
  .gantt-marker{
    position:absolute;
    top:16px;
    height:50px;
    width:1px;
    background:var(--ink);
    pointer-events:none;
    z-index:2;
  }
  .gantt-marker::after{
    content:attr(data-label);
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    font-size:13px;
    color:var(--ink);
    background:var(--bg);
    padding:0 4px;
    white-space:nowrap;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:500;
  }
  .gantt-marker.dim{background:var(--muted-dim)}
  .gantt-marker.dim::after{color:var(--muted);font-weight:400}
  .gantt-axis{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .gantt-tbd{
    margin-top:10px;
    padding:8px 10px;
    border:1px dashed var(--line-strong);
    border-radius:4px;
    font-size:14px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  /* Phase cards */
  .phase{
    padding:18px 0;
    border-top:1px solid var(--line);
  }
  .phase:first-of-type{border-top:none;padding-top:0}
  .phase-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:6px;
  }
  .phase-name{
    font-size:17px;
    color:var(--ink);
    font-weight:500;
  }
  .pill{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:3px 8px;
    border-radius:10px;
    font-weight:500;
    white-space:nowrap;
  }
  .pill.done{
    background:rgba(91,91,98,.2);
    color:var(--ink-dim);
  }
  .pill.in-progress{
    background:rgba(62,207,142,.12);
    color:var(--work);
  }
  .pill.planned{
    background:transparent;
    color:var(--muted);
    box-shadow:inset 0 0 0 1px var(--line-strong);
  }
  .pill.tbd{
    background:transparent;
    color:var(--muted-dim);
    box-shadow:inset 0 0 0 1px var(--line);
    font-style:italic;
  }
  .phase-desc{
    font-size:15px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .phase-meta{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:14px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    flex-wrap:wrap;
  }
  .phase-meta .dates{color:var(--ink-dim)}
  .phase-meta .evidence{color:var(--muted)}
  .phase-meta .evidence-note{
    color:var(--muted-dim);
    font-size:13px;
    margin-left:6px;
  }

  /* Schedule-health pill */
  .health{
    display:inline-block;
    margin-top:16px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:4px 10px;
    border-radius:11px;
    font-weight:500;
    white-space:nowrap;
    cursor:default;
  }
  .health.ok{background:rgba(62,207,142,.12);color:var(--work)}
  .health.warn{background:rgba(245,158,11,.12);color:var(--warn)}
  .health.behind{background:rgba(239,68,68,.12);color:var(--danger)}

  /* Momentum sparkline */
  .spark-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .spark-legend{
    display:flex;
    gap:18px;
    font-size:15px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .spark-legend b{color:var(--ink);font-weight:500}
  .spark-legend .dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:2px;
    margin-right:7px;
    vertical-align:middle;
  }
  .spark-legend .dot.closed{background:var(--work)}
  .spark-legend .dot.open{background:var(--time)}
  .spark-delta{
    font-size:15px;
    color:var(--work);
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }
  .spark-svg{
    width:100%;
    height:56px;
    display:block;
    overflow:visible;
  }
  .spark-foot{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:14px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .spark-empty{font-size:15px;color:var(--muted)}

  footer{
    margin-top:96px;
    padding-top:24px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  footer a{
    color:var(--ink-dim);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .2s;
  }
  footer a:hover{border-color:var(--ink-dim)}

  .err{
    padding:16px;
    border:1px solid var(--danger);
    border-radius:var(--radius);
    color:var(--danger);
    font-size:16px;
    display:none;
  }

  @media (max-width:520px){
    .wrap{padding:48px 20px}
    .hero .days{font-size:60px}
    header{margin-bottom:48px}
    .gantt-seg{padding:0 6px;font-size:13px}
  }
</style>
</head>
<body>
<div class="notice">
  <strong>Тимчасовий інструмент команди.</strong>
  Не входить у P1 CRM як фіча. Видалиться або мігрує перед MVP.
</div>
<div class="wrap">

  <header>
    <div class="logo">P1 CRM <span>Progress</span></div>
    <div class="updated" id="updated">—</div>
  </header>

  <div class="err" id="err"></div>

  <div class="hero">
    <div class="label">Days to deadline</div>
    <div class="countdown">
      <div class="days" id="days">—</div>
      <div class="days-label" id="days-label">days remaining</div>
    </div>
    <div class="deadline" id="deadline-line">—</div>
    <span class="health" id="health" style="display:none"></span>
  </div>

  <section>
    <div class="section-title">Time</div>
    <div class="bar-row">
      <div class="bar-head">
        <span class="bar-name">Time elapsed</span>
        <span class="bar-pct" id="time-pct">—</span>
      </div>
      <div class="bar-track"><div class="bar-fill time" id="time-fill" style="width:0"></div></div>
      <div class="bar-foot">
        <span id="time-start">—</span>
        <span id="time-end">—</span>
      </div>
    </div>
  </section>

  <section id="momentum">
    <div class="section-title">Momentum</div>
    <div class="spark-head" id="spark-head">
      <div class="spark-legend">
        <span><span class="dot closed"></span>Closed <b id="spark-closed-val">—</b></span>
        <span><span class="dot open"></span>Open <b id="spark-open-val">—</b></span>
      </div>
      <span class="spark-delta" id="spark-delta">—</span>
    </div>
    <svg class="spark-svg" id="spark" viewBox="0 0 320 56" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="spark-foot" id="spark-foot">
      <span id="spark-start">—</span>
      <span id="spark-end">—</span>
    </div>
    <div class="spark-empty" id="spark-empty" style="display:none">Накопичується — потрібно ≥2 зрізи історії.</div>
  </section>

  <section>
    <div class="section-title">Roadmap</div>
    <div class="gantt" id="gantt"></div>
    <div class="gantt-axis">
      <span id="axis-start">—</span>
      <span id="axis-end">—</span>
    </div>
    <div class="gantt-tbd" id="tbd-row" style="display:none"></div>
  </section>

  <section>
    <div class="section-title">Phases</div>
    <div id="phases"></div>
  </section>

  <footer>
    <span>Updated <span id="footer-updated">—</span></span>
    <a id="repo-link" href="#" target="_blank" rel="noopener">github</a>
  </footer>

</div>

<script>
(async function(){
  const $ = id => document.getElementById(id);
  const fmtDate = d => {
    if (!d) return '—';
    const dt = new Date(d + 'T00:00:00Z');
    return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
  };
  const fmtShort = d => {
    if (!d) return '—';
    const dt = new Date(d + 'T00:00:00Z');
    return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
  };
  const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a)) / 86400000);
  const STATUS_LABEL = {
    'done':'Done',
    'in-progress':'In progress',
    'planned':'Planned',
    'tbd':'TBD'
  };

  let data;
  try {
    const res = await fetch('./data.json',{cache:'no-cache'});
    if (!res.ok) throw new Error('HTTP '+res.status);
    data = await res.json();
  } catch(e) {
    const err = $('err');
    err.style.display = 'block';
    err.textContent = 'Failed to load data.json: ' + e.message;
    return;
  }

  // Top: time bar
  const today = data.updated;
  const totalDays = daysBetween(data.start, data.deadline);
  const elapsedDays = Math.max(0, Math.min(totalDays, daysBetween(data.start, today)));
  const remainingDays = Math.max(0, daysBetween(today, data.deadline));
  const timePct = totalDays > 0 ? (elapsedDays / totalDays) * 100 : 0;

  $('updated').textContent = fmtDate(data.updated);
  $('footer-updated').textContent = fmtDate(data.updated);
  $('repo-link').href = 'https://github.com/' + data.repo;

  $('days').textContent = remainingDays;
  $('days-label').textContent = remainingDays === 1 ? 'day remaining' : 'days remaining';
  $('deadline-line').textContent = 'Deadline ' + fmtDate(data.deadline);

  $('time-pct').textContent = Math.round(timePct) + '%';
  $('time-fill').style.width = timePct + '%';
  $('time-start').textContent = fmtShort(data.start);
  $('time-end').textContent = fmtShort(data.deadline);

  // Schedule-health pill — heuristic: issues-closed% vs time-elapsed%.
  // Issues aren't the full scope (see notice), so this is a rough signal only.
  const totClosed = data.phases.reduce((s,p) => s + (p.evidence?.closed || 0), 0);
  const totOpen   = data.phases.reduce((s,p) => s + (p.evidence?.open   || 0), 0);
  if (totClosed + totOpen > 0) {
    const workPct = (totClosed / (totClosed + totOpen)) * 100;
    const diff = workPct - timePct;
    let cls, label;
    if (diff >= 0)        { cls = 'ok';     label = 'On schedule'; }
    else if (diff >= -10) { cls = 'warn';   label = 'Slightly behind'; }
    else                  { cls = 'behind'; label = 'Behind'; }
    const hEl = $('health');
    hEl.className = 'health ' + cls;
    hEl.textContent = label;
    hEl.title = `${Math.round(workPct)}% issues closed vs ${Math.round(timePct)}% time elapsed `
              + `· rough heuristic — issues aren't the full scope`;
    hEl.style.display = 'inline-block';
  }

  // Momentum sparkline — closed (velocity) + open lines over history snapshots
  const hist = (data.history || []).filter(h => h.date).slice().sort((a,b) => a.date < b.date ? -1 : 1);
  if (hist.length >= 2) {
    const W = 320, H = 56, pad = 5;
    const maxV = Math.max(1, ...hist.map(h => Math.max(h.closed || 0, h.open || 0)));
    const px = i => pad + (i / (hist.length - 1)) * (W - 2 * pad);
    const py = v => H - pad - (v / maxV) * (H - 2 * pad);
    const pts = key => hist.map((h, i) => `${px(i).toFixed(1)},${py(h[key] || 0).toFixed(1)}`).join(' ');
    const SVG = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs) => {
      const e = document.createElementNS(SVG, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    };
    const polyAttrs = stroke => ({
      points: '', fill: 'none', stroke,
      'stroke-width': 1.75, 'vector-effect': 'non-scaling-stroke',
      'stroke-linejoin': 'round', 'stroke-linecap': 'round'
    });
    const svg = $('spark');
    svg.appendChild(mk('polyline', { ...polyAttrs('var(--time)'), points: pts('open') }));
    svg.appendChild(mk('polyline', { ...polyAttrs('var(--work)'), points: pts('closed') }));
    const last = hist.length - 1;
    svg.appendChild(mk('circle', { cx: px(last), cy: py(hist[last].open || 0),   r: 2.5, fill: 'var(--time)' }));
    svg.appendChild(mk('circle', { cx: px(last), cy: py(hist[last].closed || 0), r: 2.5, fill: 'var(--work)' }));

    const dClosed = (hist[last].closed || 0) - (hist[0].closed || 0);
    $('spark-closed-val').textContent = hist[last].closed || 0;
    $('spark-open-val').textContent   = hist[last].open || 0;
    $('spark-delta').textContent = `${dClosed >= 0 ? '+' : ''}${dClosed} closed since ${fmtShort(hist[0].date)}`;
    $('spark-start').textContent = fmtShort(hist[0].date);
    $('spark-end').textContent   = fmtShort(hist[last].date);
  } else {
    $('spark-head').style.display = 'none';
    $('spark').style.display = 'none';
    $('spark-foot').style.display = 'none';
    $('spark-empty').style.display = 'block';
  }

  // Gantt: phases with concrete dates only
  const datedPhases = data.phases.filter(p => p.start && p.end);
  const tbdPhases = data.phases.filter(p => !p.start || !p.end);

  // Range: from project start to deadline (or last phase end if it extends)
  const rangeStart = data.start;
  const rangeEnd = datedPhases.reduce(
    (acc, p) => new Date(p.end) > new Date(acc) ? p.end : acc,
    data.deadline
  );
  const rangeTotal = daysBetween(rangeStart, rangeEnd);

  const ganttEl = $('gantt');
  const trackEl = document.createElement('div');
  trackEl.className = 'gantt-track';

  datedPhases.forEach(p => {
    const dur = daysBetween(p.start, p.end);
    const pctWidth = (dur / rangeTotal) * 100;
    const seg = document.createElement('div');
    seg.className = 'gantt-seg ' + p.status;
    seg.style.flex = `0 0 ${pctWidth}%`;
    seg.title = `${p.name} · ${fmtShort(p.start)} → ${fmtShort(p.end)}`;
    seg.textContent = p.name;
    trackEl.appendChild(seg);
  });

  ganttEl.appendChild(trackEl);

  // Today marker (appended to gantt wrapper, not track, so it can overflow)
  const todayOffset = (daysBetween(rangeStart, today) / rangeTotal) * 100;
  if (todayOffset >= 0 && todayOffset <= 100) {
    const marker = document.createElement('div');
    marker.className = 'gantt-marker';
    marker.style.left = todayOffset + '%';
    marker.setAttribute('data-label','Today');
    ganttEl.appendChild(marker);
  }

  // Deadline marker (if range extends past deadline)
  if (new Date(rangeEnd) > new Date(data.deadline)) {
    const ddOffset = (daysBetween(rangeStart, data.deadline) / rangeTotal) * 100;
    const dm = document.createElement('div');
    dm.className = 'gantt-marker dim';
    dm.style.left = ddOffset + '%';
    dm.setAttribute('data-label','Deadline');
    ganttEl.appendChild(dm);
  }

  // Milestone markers from data (checkpoints inside the range)
  (data.milestones || []).forEach(m => {
    if (!m.date) return;
    const off = (daysBetween(rangeStart, m.date) / rangeTotal) * 100;
    if (off < 0 || off > 100) return;
    const mk = document.createElement('div');
    mk.className = 'gantt-marker dim';
    mk.style.left = off + '%';
    mk.title = `${m.label || 'Milestone'} · ${fmtShort(m.date)}`;
    mk.setAttribute('data-label', m.label || 'Milestone');
    ganttEl.appendChild(mk);
  });

  $('axis-start').textContent = fmtShort(rangeStart);
  $('axis-end').textContent = fmtShort(rangeEnd);

  // TBD row (Phase 3 etc.)
  if (tbdPhases.length) {
    const tbdEl = $('tbd-row');
    tbdEl.style.display = 'flex';
    const names = tbdPhases.map(p => p.name).join(', ');
    tbdEl.innerHTML = `<span>${names} — TBD (post-launch)</span><span class="pill tbd">TBD</span>`;
  }

  // Phase cards
  const phasesEl = $('phases');
  data.phases.forEach(p => {
    const div = document.createElement('div');
    div.className = 'phase';
    const statusLabel = STATUS_LABEL[p.status] || p.status;
    const dates = (p.start && p.end)
      ? `${fmtShort(p.start)} → ${fmtShort(p.end)}`
      : 'Dates TBD';
    let evidenceHtml = '';
    if (p.evidence && (p.evidence.closed !== undefined || p.evidence.open !== undefined)) {
      const c = p.evidence.closed ?? 0;
      const o = p.evidence.open ?? 0;
      const note = p.evidence.note ? `<span class="evidence-note">${p.evidence.note}</span>` : '';
      evidenceHtml = `<span class="evidence">${c} closed · ${o} open${note}</span>`;
    }
    div.innerHTML = `
      <div class="phase-head">
        <span class="phase-name">${p.name}</span>
        <span class="pill ${p.status}">${statusLabel}</span>
      </div>
      <div class="phase-desc">${p.description || ''}</div>
      <div class="phase-meta">
        <span class="dates">${dates}</span>
        ${evidenceHtml}
      </div>
    `;
    phasesEl.appendChild(div);
  });
})();
</script>
</body>
</html>
